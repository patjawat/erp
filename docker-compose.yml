# https://crontab.guru/ ตั้งเวลา
services:
  php:
    container_name: ${CONTAINER_NAME}
    image: yiisoftware/yii2-php:8.2-apache
    environment:
      - TZ=Asia/Bangkok
      - PHP_MEMORY_LIMIT=2048M
      # เชื่อมต่อ Ollama (AI สรุป PDF) - ใช้ hostname ollama เมื่อรันใน Docker
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
      - ./docker-php-memlimit.ini:/usr/local/etc/php/conf.d/docker-php-memlimit.ini
      - /Volumes/Backup/erp/source/dansai/fileupload:/app/modules/filemanager/fileupload
    ports:
      - "${HOS_CODE}:80"
    links:
      - mysqlDB:db
    env_file:
      - ./.env

    # ใช้ custom command เพื่อเปิดใช้งาน calendar extension
    command: >
      bash -c "docker-php-ext-install calendar && apache2-foreground"
  mysqlDB:
    image: mysql:8.0
    container_name: ${CONTAINER_NAME}_db
    hostname: mysqldboffice
    # mem_limit: 1g
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      - TZ=Asia/Bangkok
      - MYSQL_ROOT_PASSWORD=docker
      - MYSQL_PASSWORD=docker
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=${DB_NAME}
    command:
      [
    #     "mysqld",
    #     # "--lower_case_table_names=2",
    #     "--max_allowed_packet=1G",
    #     "--innodb-buffer-pool-size=1G",
    #     "--innodb-log-file-size=256M",
    #     "--innodb-flush-log-at-trx-commit=2",
    #     "--innodb-flush-method=O_DIRECT",
    #     "--tmp_table_size=64M",
    #     "--max-heap-table-size=64M",
    #     "--max-connections=200",
    #     "--table-open-cache=400",
    #     "--wait_timeout=28800",
    #     "--interactive_timeout=28800",
    #     "--character-set-server=utf8mb4",
    #     "--collation-server=utf8mb4_general_ci",
        "--sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
      ]

    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./docker/mysql8.0/data:/var/lib/mysql
      # - ./docker/mysql_dansai8.0/data:/var/lib/mysql
      # - ./my.cnf:/etc/mysql/conf.d/my.cnf
      # - ./docker/mysql5.7/db/init.sql:/docker-entrypoint-initdb.d/init.sql
  phpmyadmin_mysql:
    image: phpmyadmin
    container_name: ${CONTAINER_NAME}_pma
    restart: always
    links:
      - mysqlDB:db
    ports:
      - ${PAM_PORT}:80
    environment:
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: docker
      PMA_HOST: mysqlDB
      UPLOAD_LIMIT: 900M
  databasus:
    container_name: databasus
    image: databasus/databasus:latest  # ลบ ./docker/ ออก
    ports:
      - "4005:4005"
    volumes:
      - ./docker/databasus-data:/databasus-data
    restart: unless-stopped

networks:
  web-network:
    driver: bridge